# ==============================================================================
# Debezium Server Configuration - CDC Outbox Event Router para RabbitMQ
# ==============================================================================

# Source Connector (PostgreSQL CDC via WAL com pgoutput)
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

debezium.source.database.hostname=${DB_HOST:payment-postgres}
debezium.source.database.port=${DB_PORT:5432}
debezium.source.database.user=${DB_USER:postgres}
debezium.source.database.password=${DB_PASSWORD:postgres}
debezium.source.database.dbname=${DB_NAME:payment_db}
debezium.source.topic.prefix=${SERVICE_NAME:payment-ms}
debezium.source.plugin.name=pgoutput

# Filtragem exclusiva da tabela outbox
debezium.source.table.include.list=public.outbox
debezium.source.tombstones.on.delete=false

# Single Message Transform (SMT) - Outbox Event Router
debezium.source.transforms=outbox
debezium.source.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.source.transforms.outbox.table.fields.additional.placement=type:header:eventType
debezium.source.transforms.outbox.route.topic.replacement=${RABBITMQ_EXCHANGE:payment.events}

# Sink Connector (RabbitMQ)
debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=${RABBITMQ_HOST:rabbitmq}
debezium.sink.rabbitmq.connection.port=${RABBITMQ_PORT:5672}
debezium.sink.rabbitmq.connection.username=${RABBITMQ_USER:guest}
debezium.sink.rabbitmq.connection.password=${RABBITMQ_PASSWORD:guest}
debezium.sink.rabbitmq.exchange=${RABBITMQ_EXCHANGE:payment.events}
debezium.sink.rabbitmq.routingKey=${RABBITMQ_ROUTING_KEY:payment.events}
